server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фото сценариев загружаются из админки (лимит бэкенда — 5 МБ).
    client_max_body_size 10m;

    # API, загруженные фото и документация — в контейнер бэкенда.
    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Собранные файлы с хешем в имени можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Игра и админка (/admin) — одно SPA-приложение.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
